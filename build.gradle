buildscript {
    repositories {
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net'
        }
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'java'
apply plugin: 'org.spongepowered.mixin'

version = '2.0.0-pre.4.1'
group = 'wtf.tatp.meowtils'
archivesBaseName = 'Meowtils'

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
    makeObfSourceJar = false
}

mixin {
    add sourceSets.main, 'mixins.meowtils.refmap.json'
}

repositories {
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    mavenCentral()
}

configurations {
    shade
}

dependencies {
    compileOnly('org.spongepowered:mixin:0.7.10-SNAPSHOT') {
        transitive = false
    }
    shade('org.spongepowered:mixin:0.7.10-SNAPSHOT') {
        transitive = false
    }
    compileOnly('net.java.dev.jna:jna:5.13.0') {
        transitive = false
    }
    shade('net.java.dev.jna:jna:5.13.0') {
        transitive = false
    }
}

jar {
    duplicatesStrategy = 'exclude'
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
    manifest {
        attributes(
            'MixinConfigs': 'mixins.meowtils.json',
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'TweakOrder': '0',
            'ForceLoadAsMod': 'true',
            'FMLCorePluginContainsFMLMod': 'true',
            'FMLCorePlugin': 'wtf.tatp.meowtils.mixins.MixinLoader',
            'ModSide': 'CLIENT'
        )
    }
}
